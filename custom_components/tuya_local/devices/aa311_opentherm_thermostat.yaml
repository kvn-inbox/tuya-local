name: OpenTherm thermostat
products:
  - id: 1noxj7zzpwslub7q
    model: AA311
entities:
  - entity: climate
    translation_key: thermostat
    dps:
      - id: 2
        name: hvac_mode
        type: string
        mapping:
          - dps_val: "off"
            value: "off"
          - dps_val: manual
            value: heat
          - dps_val: auto
            value: auto
          - dps_val: holiday
            value: heat
            hidden: true
      - id: 3
        name: temperature
        type: integer
        unit: C
        range:
          min: 50
          max: 400
        mapping:
          - scale: 10
            step: 5
      - id: 24
        name: current_temperature
        type: integer
        mapping:
          - scale: 10
      - id: 110
        name: hvac_action
        type: boolean
        mapping:
          - dps_val: true
            value: heating
          - dps_val: false
            value: idle
  - entity: binary_sensor
    name: Flame
    class: heat
    dps:
      - id: 110
        type: boolean
        name: sensor
  - entity: sensor
    name: Modulation level
    dps:
      - id: 120
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: sensor
    name: Heating water temperature
    class: temperature
    dps:
      - id: 129
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    name: Heating water target temperature
    class: temperature
    dps:
      - id: 130
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: sensor
    name: Domestic hot water temperature
    class: temperature
    dps:
      - id: 134
        type: integer
        name: sensor
        unit: C
        class: measurement
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 35
        type: integer
        name: sensor
        mapping:
          - dps_val: 0
            value: false
          - value: true
      - id: 35
        type: integer
        name: fault_code
  - entity: binary_sensor
    class: battery
    category: diagnostic
    dps:
      - id: 35
        type: integer
        name: sensor
        mapping:
          - dps_val: 1
            value: true
          - value: false
  - entity: binary_sensor
    class: connectivity
    category: diagnostic
    dps:
      - id: 35
        type: integer
        name: sensor
        mapping:
          - dps_val: 100
            value: false
          - value: true
  - entity: sensor
    name: Control interface
    category: diagnostic
    hidden: true
    dps:
      - id: 121
        type: string
        name: sensor
  - entity: sensor
    name: Heating water maximum temperature
    category: diagnostic
    class: temperature
    hidden: true
    dps:
      - id: 125
        type: integer
        name: sensor
        unit: C
  - entity: sensor
    name: Heating water minimum temperature
    category: diagnostic
    class: temperature
    hidden: true
    dps:
      - id: 126
        type: integer
        name: sensor
        unit: C
  - entity: sensor
    name: Domestic hot water minimum temperature
    category: diagnostic
    class: temperature
    hidden: true
    dps:
      - id: 128
        type: integer
        name: sensor
        unit: C
  - entity: sensor
    name: Domestic hot water maximum temperature
    category: diagnostic
    class: temperature
    hidden: true
    dps:
      - id: 132
        type: integer
        name: sensor
        unit: C
  - entity: number
    name: Domestic hot water target temperature
    category: config
    class: temperature
    dps:
      - id: 127
        type: integer
        name: value
        unit: C
        range:
          min: 35
          max: 60
  - entity: switch
    name: Boost
    dps:
      - id: 101
        type: boolean
        name: switch
  - entity: select
    name: Control logic
    category: config
    dps:
      - id: 119
        type: string
        name: option
        mapping:
          - dps_val: Nor
            value: Normal
          - dps_val: OS
            value: Optimum start
          - dps_val: TPI
            value: TPI
  - entity: number
    name: Frost protection temperature
    category: config
    class: temperature
    dps:
      - id: 107
        type: integer
        name: value
        unit: C
        range:
          min: 50
          max: 150
        mapping:
          - scale: 10
            step: 5
  - entity: number
    translation_key: temperature_calibration
    class: temperature_delta
    category: config
    dps:
      - id: 27
        type: integer
        name: value
        unit: C
        range:
          min: -50
          max: 50
        mapping:
          - scale: 10
  - entity: number
    name: Heating on hysteresis
    class: temperature_delta
    category: config
    dps:
      - id: 117
        type: integer
        name: value
        unit: C
        range:
          min: 1
          max: 30
        mapping:
          - scale: 10
  - entity: number
    name: Heating off hysteresis
    class: temperature_delta
    category: config
    dps:
      - id: 118
        type: integer
        name: value
        unit: C
        range:
          min: 1
          max: 30
        mapping:
          - scale: 10
  - entity: switch
    name: Daylight saving time
    category: config
    dps:
      - id: 138
        type: boolean
        name: switch
