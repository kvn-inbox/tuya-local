name: Air quality monitor
products:
  - id: spaxp3r2hkddazyg
    manufacturer: Nobito
    model: 2C09TB
entities:
  - entity: sensor
    translation_key: air_quality
    class: enum
    dps:
      - id: 1
        type: string
        name: sensor
        mapping:
          - dps_val: level_1
            value: excellent
          - dps_val: level_2
            value: good
          - dps_val: level_3
            value: poor
          - dps_val: level_4
            value: severe
  - entity: sensor
    class: temperature
    dps:
      - id: 2
        type: integer
        name: sensor
        class: measurement
        mapping:
          - scale: 10
      - id: 102
        type: string
        name: unit
        mapping:
          - dps_val: c
            value: C
          - dps_val: f
            value: F
  - entity: sensor
    class: humidity
    dps:
      - id: 3
        type: integer
        name: sensor
        unit: "%"
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    class: pm25
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: sensor
    class: pm1
    dps:
      - id: 8
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: sensor
    class: pm10
    dps:
      - id: 9
        type: integer
        name: sensor
        unit: ugm3
        class: measurement
  - entity: sensor
    class: battery
    category: diagnostic
    dps:
      - id: 22
        type: integer
        name: sensor
        unit: "%"
        class: measurement
  - entity: switch
    translation_key: sound
    category: config
    dps:
      - id: 122
        type: boolean
        name: switch
  - entity: number
    name: Backlight
    category: config
    dps:
      - id: 121
        type: integer
        name: value
        range:
          min: 1
          max: 5
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 102
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: switch
    name: Interval time
    category: config
    dps:
      - id: 136
        type: boolean
        name: switch
  - entity: number
    name: Interval time
    category: config
    dps:
      - id: 135
        type: integer
        name: value
        unit: min
        range:
          min: 1
          max: 60
  - entity: switch
    name: Pressure value
    category: config
    dps:
      - id: 103
        type: boolean
        name: switch
  - entity: number
    name: Pressure value
    category: config
    dps:
      - id: 101
        type: integer
        name: value
        unit: Pa
        range:
          min: 20
          max: 500
  - entity: switch
    name: High temperature alarm
    category: config
    dps:
      - id: 127
        type: boolean
        name: switch
  - entity: number
    name: High temperature alarm
    category: config
    class: temperature
    dps:
      - id: 117
        type: integer
        name: value
        unit: C
        range:
          min: -200
          max: 600
        mapping:
          - scale: 10
  - entity: switch
    name: Low temperature alarm
    category: config
    dps:
      - id: 128
        type: boolean
        name: switch
  - entity: number
    name: Low temperature alarm
    category: config
    class: temperature
    dps:
      - id: 125
        type: integer
        name: value
        unit: C
        range:
          min: -200
          max: 600
        mapping:
          - scale: 10
